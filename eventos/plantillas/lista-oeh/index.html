<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi lista de regalos</title>
    <link rel="stylesheet" href="../../../css/style2.css"> <!-- Estilos globales -->
</head>
<body>

    <!-- El contenedor principal abre justo después del body -->
    <div class="contenedor-principal">

        <!-- 1. Portada -->
        <header class="portada">
            <img src="img/jediCumple.png" alt="Mi cumple 27" class="imagen-portada">
            <h1>Mi cumple 27</h1>
            <h2></h2>
        </header>

        
        <!-- 2. Reproductor 
        <section class="audio-player">
            <h3>Reproduce mi canción:</h3>
            
            <!-- Etiqueta de audio oculta 
            <audio id="musicaFondo" loop>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>

            <!-- Controles personalizados 
            <div class="controles-audio">
                <button id="btnPlayPause" class="btn-musica">▶️ Reproducir</button>
            </div>
        </section>  -->


        <!-- 3. Calendario y Cuenta Regresiva -->
        <section class="fecha-contador">
            <h3>Faltan:</h3>
            
            <!-- Estructura actualizada para que funcione el JavaScript -->
            <div id="contador" class="contador-grid">
                <div class="tiempo-caja">
                    <span id="dias">00</span>
                    <p>DÍAS</p>
                </div>
                <div class="tiempo-caja">
                    <span id="horas">00</span>
                    <p>HORAS</p>
                </div>
                <div class="tiempo-caja">
                    <span id="minutos">00</span>
                    <p>MINUTOS</p>
                </div>
                <div class="tiempo-caja">
                    <span id="segundos">00</span>
                    <p>SEGUNDOS</p>
                </div>
            </div>
        </section>

        <!-- 4. Itinerario -->
        <section class="itinerario">
            <h3>Ven a celebrar el día:</h3>
            
            <div class="bloque-fecha">
                <div class="dia-anio">
                    <span class="dia-texto">Jueves</span>
                    <span class="numero-dia">01</span>
                    <span class="dia-texto">De</span>
                    <span class="mes-destacado">Octubre </span>
                    <span class="anio-texto">2026</span>
                </div>
               
            </div>

            <!---
            <div class="detalles-evento">
                <p>⛪ <strong>Misa:</strong> 7:00 pm</p>
                <p>🥂 <strong>Recepción:</strong> 7:30 pm</p>
            </div>
        -->
        </section>

        <!-- 5. Ubicación 
        <section class="ubicacion">
            <h3>Recepción:</h3>
            
            <div class="icono-ubicacion">📍</div>
            <h4>Salón de eventos Arantzza</h4>
            
            <p class="direccion">
                Batalla de Tunas Blancas #30<br>
                esquina 24 de abril de 1860<br>
                C.P. 09310 CDMX Alcaldía Iztapalapa.
            </p>
            
            <!-- Aquí el cliente te pasará el link de Google Maps 
            <a href="https://maps.app.goo.gl/MJUjmSMfWb8u4P2b6" target="_blank" class="btn-ubicacion">Ver en Mapa</a>
        </section>
         -->

        <!-- 6. Sección Opcional: Lista de Deseos / Mesa de Regalos -->
        <section class="lista-deseos">
            <h3>Mesa de Regalos</h3>
            
            <div class="grid-regalos">
                <!-- Artículo 1 -->
                <div class="regalo-item">
                    <img src="img/soporte.png" alt="Regalo sugerido">
                    <p>Soporte de lap</p>
                    <a href="https://a.co/d/0hfRt69N" target="_blank" class="btn-tienda">Ver en Tienda</a>
                </div>
                
                <!-- Artículo 2 -->
                <div class="regalo-item">
                    <img src="img/destonillador.png" alt="Regalo sugerido">
                    <p>Destonillador electrico</p>
                    <a href="https://www.mercadolibre.com.mx/p/MLM60723140?pdp_filters=item_id:MLM4889058070#origin=share&sid=share&wid=MLM4889058070&action=copy" target="_blank" class="btn-tienda">Ver Tienda</a>
                </div>

                <div class="regalo-item">
                    <img src="img/base.png" alt="Regalo sugerido">
                    <p>Base para soldar</p>
                    <a href="https://vt.tiktok.com/ZS9BcJ6Yu2sBx-EaqQM/" target="_blank" class="btn-tienda">Ver Tienda</a>
                </div>

                <div class="regalo-item">
                    <img src="img/money.jpeg" alt="Regalo sugerido">
                    <p>Money</p>
                    <!-- <a href="https://a.co/d/0jdUFQ4G" target="_blank" class="btn-tienda">Ver Tienda</a> -->
                </div>

                <div class="regalo-item">
                    <img src="img/abrazo.jpeg" alt="Regalo sugerido">
                    <p>Un abrazo cariñoso</p>
                    <!-- <a href="https://a.co/d/0jdUFQ4G" target="_blank" class="btn-tienda">Ver Tienda</a> -->
                </div>

                
            </div>
        </section>

        <section class="confirmacion">

                💬 Confirmar Asistencia
            </a>
        </section>
